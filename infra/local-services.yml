# ONLY local third-party data services; application Dockerfiles and Kubernetes are your DevOps work.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: smart
      POSTGRES_PASSWORD: smart_dev
      POSTGRES_DB: postgres
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["smart_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart -d postgres"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["smart_redis:/data"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 15
volumes:
  smart_pg:
  smart_redis:
